# Render Blueprint for the AutoRecon AI backend.
# Secrets marked sync: false must be filled in on the Render dashboard.
services:
  - type: web
    name: autorecon-ai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: autorecon-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: HIBP_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: autorecon-db
    databaseName: autorecon
    user: autorecon_user
    plan: free
